name: companion code

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  listings:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Every listing runs
        run: python run.py --all

      - name: Test suite
        run: python -m pytest tests/ -q

      - name: Listing 21.1 structural check
        run: python listings/ch21/validate_21_1.py

      - name: Listing 44.1 copies match the root files
        shell: bash
        run: |
          diff Dockerfile listings/ch44/Dockerfile
          diff docker-compose.yml listings/ch44/docker-compose.yml

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compose file is valid
        run: docker compose config --quiet

      - name: Build the image of Listing 44.1
        run: docker compose build app

      - name: The service answers the health check
        run: |
          docker compose up -d app
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health | grep -q '"ok"'; then
              echo "health ok"; exit 0
            fi
            sleep 2
          done
          docker compose logs app
          exit 1

  sql:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Listing 14.2 applies to a real pgvector database
        env:
          PGPASSWORD: atlas
        # The listing ends with a parameterized query ($1 = query vector,
        # $2 = group ids) meant to be called from application code. Apply
        # everything before it, then PREPARE the query with its declared
        # types (which type-checks and plans it) and run it once.
        run: |
          f=listings/ch14/listing_14_2.sql
          n=$(grep -n '^SELECT c.id' "$f" | cut -d: -f1)
          head -n $((n - 1)) "$f" > /tmp/schema.sql
          tail -n +"$n" "$f" | sed 's/;[[:space:]]*$//' > /tmp/query.sql
          {
            cat /tmp/schema.sql
            echo "PREPARE nearest(vector(1024), text[]) AS"
            cat /tmp/query.sql
            echo ";"
            echo "EXECUTE nearest(array_fill(0.1, ARRAY[1024])::vector, ARRAY['staff']);"
          } > /tmp/check.sql
          psql -h localhost -U atlas -d atlas -v ON_ERROR_STOP=1 -f /tmp/check.sql
