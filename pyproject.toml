[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-companion-code"
version = "1.0.0"
description = "Companion code for The Production AI Engineering Handbook"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Arslan ud Din Shafiq" }]
license = { file = "LICENSE" }
dependencies = [
  "numpy>=2.1,<3",
  "PyYAML>=6.0,<7",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "httpx2>=0.1"]

[tool.setuptools]
packages = ["atlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
