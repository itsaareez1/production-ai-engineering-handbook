[flake8]
max-line-length = 79
exclude = .venv,__pycache__,.pytest_cache
# E741: the listings use `l` as a loop variable in a few places,
# exactly as printed in the book. The repository does not silently
# diverge from the page over style.
# F841: Listing 37.1 assigns `used` and never reads it -- a real but
# harmless dead local, recorded in ../ERRATA.md as ERR-07.
per-file-ignores =
    listings/*:E741,F841
