# Listing 44.1 (part 2 of 2). Local environment for Atlas: Compose
# definition. Chapter 44, Deploying AI Applications.
#
# This file is an exact copy of ./docker-compose.yml at the
# repository root, which is the one Compose reads. Start it with:
#   docker compose up --build
services:
  app:
    build: .
    ports: ["8000:8000"]
    # optional; copy .env.example to .env (never committed)
    env_file:
      - path: .env
        required: false
    environment:
      ATLAS_ENV: dev
      ATLAS_DATABASE_URL: postgresql://atlas:atlas@db:5432/atlas
      ATLAS_MODEL_PROVIDER: mock
      ATLAS_SEED_CORPUS: /app/examples/corpus
    depends_on:
      migrate:
        condition: service_completed_successfully
  migrate:
    # one-shot: applies atlas/db/migrations, then exits
    build: .
    command: ["python", "-m", "atlas.db.migrate"]
    environment:
      ATLAS_DATABASE_URL: postgresql://atlas:atlas@db:5432/atlas
    depends_on:
      db:
        condition: service_healthy
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 2s
      retries: 30
    volumes: ["dbdata:/var/lib/postgresql/data"]
  cache:
    image: redis:7-alpine
  objects:
    # S3-compatible object store on port 9000 (SeaweedFS; pinned).
    image: chrislusf/seaweedfs:3.80
    command: server -dir=/data -s3 -s3.port=9000
    volumes: ["objectdata:/data"]
  inference:
    # Optional self-hosted model; replace the image with your
    # serving engine (Appendix L), pinned to a tested tag. Needs a
    # GPU. Not started unless:
    #   docker compose --profile live up
    image: vllm/vllm-openai:v0.32.0
    profiles: ["live"]
    ports: ["8080:8000"]
volumes:
  dbdata: {}
  objectdata: {}
