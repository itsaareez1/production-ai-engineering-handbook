# Listing 44.1 (part 2 of 2). Local environment for Atlas: Compose
# definition. Chapter 44, Environments and Deployment.
#
# This file is an exact copy of ./docker-compose.yml at the
# repository root, which is the one Compose reads. Start it with:
#   docker compose build && docker compose up
services:
  app:
    build: .
    ports: ["8000:8000"]
    # never committed; contains dev secrets only
    env_file:
      - path: .env.local
        required: false
    environment:
      ATLAS_ENV: local
      # 'replay' = recorded responses; 'live' = model
      GATEWAY_MODE: replay
      MODEL_ENDPOINT: http://inference:8080/v1
      DATABASE_URL: postgresql://atlas:atlas@db:5432/atlas
      REDIS_URL: redis://cache:6379/0
      OBJECT_STORE_URL: http://objects:9000
    depends_on: [db, cache, objects]
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas
    volumes: ["dbdata:/var/lib/postgresql/data"]
  cache:
    image: redis:7-alpine
  objects:
    # The book prints `minio/minio`, which is no longer pullable from
    # any public registry (ERRATA.md, ERR-05). SeaweedFS serves the
    # same S3 API on the same port, so nothing above it changes.
    image: chrislusf/seaweedfs:3.80
    command: server -dir=/data -s3 -s3.port=9000
    volumes: ["objectdata:/data"]
  inference:
    # placeholder
    image: ghcr.io/example/openai-compatible-server:latest
    # start with: docker compose --profile live up
    profiles: ["live"]
    ports: ["8080:8080"]
volumes:
  dbdata: {}
  objectdata: {}
