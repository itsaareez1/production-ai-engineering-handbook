# Listing 44.1 (part 2 of 2), EXACTLY AS PRINTED in the book.
#
# This file is kept for reference only. It does NOT start: the image
# `minio/minio` is no longer pullable from Docker Hub or quay.io for
# any tag, so `docker compose up` fails before any service starts.
# See ../../../ERRATA.md, ERR-05.
#
# The working version is docker-compose.yml beside this file.
services:
  app:
    build: .
    ports: ["8000:8000"]
    # never committed; contains dev secrets only
    env_file:
      - path: .env.local
        required: false
    environment:
      ATLAS_ENV: local
      # 'replay' = recorded responses; 'live' = model
      GATEWAY_MODE: replay
      MODEL_ENDPOINT: http://inference:8080/v1
      DATABASE_URL: postgresql://atlas:atlas@db:5432/atlas
      REDIS_URL: redis://cache:6379/0
      OBJECT_STORE_URL: http://objects:9000
    depends_on: [db, cache, objects]
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas
    volumes: ["dbdata:/var/lib/postgresql/data"]
  cache:
    image: redis:7-alpine
  objects:
    image: minio/minio
    command: server /data
    environment:
      MINIO_ROOT_USER: atlas
      MINIO_ROOT_PASSWORD: atlas-local
  inference:
    # placeholder
    image: ghcr.io/example/openai-compatible-server:latest
    # start with: docker compose --profile live up
    profiles: ["live"]
    ports: ["8080:8080"]
volumes:
  dbdata: {}
